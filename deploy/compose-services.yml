# These blocks are merged into /home/plex/docker-compose.yml on the homelab server.
# Only warcraft-quest-immersion publishes a host port. The optional database is private.
services:
  warcraft-quest-immersion:
    build:
      context: /opt/warcraft-quest-immersion
    image: warcraft-quest-immersion:local
    container_name: warcraft-quest-immersion
    env_file:
      - /opt/warcraft-quest-immersion/.env
    environment:
      MYSQL_HOST: warcraft-quest-db
      WQI_DATA_DIR: /app/data
    ports:
      - "8090:8080"
    volumes:
      - /opt/warcraft-quest-immersion/data:/app/data
      - /opt/warcraft-quest-immersion/AI_VoiceOverData_Vanilla/generated:/app/AI_VoiceOverData_Vanilla/generated
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  warcraft-quest-db:
    profiles: ["warcraft-data"]
    image: mysql:8.4
    container_name: warcraft-quest-db
    env_file:
      - /opt/warcraft-quest-immersion/.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - warcraft-quest-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  warcraft-quest-db-data:
    name: warcraft-quest-db-data
