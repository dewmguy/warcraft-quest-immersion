services:
  warcraft-quest-immersion:
    build:
      context: .
    image: warcraft-quest-immersion:local
    container_name: warcraft-quest-immersion
    env_file:
      - .env
    environment:
      MYSQL_HOST: warcraft-quest-db
      WQI_DATA_DIR: /app/data
    ports:
      - "${WQI_WEB_PORT:-8090}:8080"
    volumes:
      - ./data:/app/data
      - ./AI_VoiceOverData_Vanilla/generated:/app/AI_VoiceOverData_Vanilla/generated
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  warcraft-quest-db:
    profiles: ["warcraft-data"]
    image: mysql:8.4
    container_name: warcraft-quest-db
    env_file:
      - .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - warcraft-quest-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  warcraft-quest-source-db:
    profiles: ["corpus-build"]
    image: mariadb:11.4
    container_name: warcraft-quest-source-db
    environment:
      MARIADB_ROOT_PASSWORD: "${AZEROTHCORE_MYSQL_PASSWORD:-change-me-before-corpus-restore}"
      MARIADB_DATABASE: "${AZEROTHCORE_MYSQL_DATABASE:-acore_world}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - warcraft-quest-source-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: "no"

volumes:
  warcraft-quest-db-data:
    name: warcraft-quest-db-data
  warcraft-quest-source-db-data:
    name: warcraft-quest-source-db-data
